<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — MPC Supply Chain System</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='access/access.css') }}">
    <script>if (window.top !== window) window.top.location = window.location.href;</script>
</head>
<body>
    <div class="login-box">
        <div class="acc-titlebar"><img src="{{ url_for('static', filename='favicon.png') }}" alt=""><span class="t">MPC Database and Reporting System</span></div>
        <div class="body">
            <img class="logo" src="{{ url_for('static', filename='access/mpc_logo.png') }}" alt="MPC — Modern Petrochemicals Co.">
            <h1>MPC Supply Chain System</h1>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}
            {% endwith %}
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required autofocus></div>
                <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" required></div>
                <button type="submit" class="btn-blue">Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
